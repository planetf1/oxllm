name: Publish to crates.io

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to publish (e.g. v0.1.1)'
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'Tag or ref to publish (e.g. v0.1.1)'
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-core:
    name: oxllm-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1
        with:
          toolchain: stable
      - name: Publish oxllm-core (idempotent)
        run: |
          output=$(cargo publish -p oxllm-core 2>&1) && echo "$output" || {
            if echo "$output" | grep -qE "already uploaded|already exists"; then
              echo "oxllm-core version already published — skipping"
            else
              echo "$output" >&2; exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-oxllm:
    name: oxllm
    needs: publish-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1
        with:
          toolchain: stable
      - name: Wait for crates.io index
        run: sleep 120
      - name: Publish oxllm (idempotent)
        run: |
          output=$(cargo publish -p oxllm 2>&1) && echo "$output" || {
            if echo "$output" | grep -qE "already uploaded|already exists"; then
              echo "oxllm version already published — skipping"
            else
              echo "$output" >&2; exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
